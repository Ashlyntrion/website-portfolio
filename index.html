<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Portfolio — Design Sample</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#faf6ee;--ink:#2b2a24;--gold:#b98a2f;--olive:#6b7250}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--cream);color:var(--ink);
      font-family:"Manrope",system-ui,sans-serif;padding:2rem;text-align:center}
    h1{font-family:"Fraunces",Georgia,serif;font-size:clamp(1.9rem,4.5vw,3rem);margin:0 0 .6rem;line-height:1.1}
    p{color:#5a5749;max-width:46ch;margin:0 auto 1.8rem}
    .btn{display:inline-block;background:var(--gold);color:#fff;text-decoration:none;font-weight:700;
      padding:.9rem 1.7rem;border-radius:999px;margin:.3rem}
    .btn.ghost{background:none;color:var(--olive);border:1.5px solid rgba(43,42,36,.15)}
    small{display:block;margin-top:2.2rem;color:#8a8778;font-size:.78rem}
  </style>
</head>
<body>
  <main>
    <h1>Website Portfolio</h1>
    <p>Selected client work: a multi-page marketing site and a custom WordPress theme.
       The live sample uses a fictional brand and placeholder imagery.</p>
    <a class="btn" href="demo/">View the design sample</a>
    <a class="btn ghost" href="https://github.com/Ashlyntrion/website-portfolio/blob/main/README.md">Read the case study</a>
    <small>Client names, copy, photography and contact details are withheld.</small>
  </main>
</body>
</html>
